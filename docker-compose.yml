services:
  postgres:
    image: postgres:16-alpine
    container_name: bpsc-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bpsc
      POSTGRES_PASSWORD: bpsc_local_password
      POSTGRES_DB: bpsc_local
    ports:
      - "5432:5432"
    volumes:
      - bpsc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpsc -d bpsc_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bpsc-postgres-data:
